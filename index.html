<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/dcs_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DCS Blog - Modern Technology & Engineering Articles</title>
    <meta name="description" content="Explore cutting edge technology, architecture, microservices, and AI software engineering articles on DCS Blog." />

    <!-- Google Translate Initialization Script -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,kn,hi,ta,te,mr,bn,gu,ml,pa,es,fr,de,ja,zh-CN,ar,pt,ru,it,ko,nl,tr',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </head>
  <body>
    <!-- Hidden Google Translate Element Container (standard layout generates .goog-te-combo) -->
    <div id="google_translate_element" style="position:fixed;bottom:0;left:0;width:0;height:0;opacity:0;overflow:hidden;pointer-events:none;z-index:-9999;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
